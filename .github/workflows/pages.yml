name: Validate and deploy Nuglyan
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'tests/**'
      - 'supabase/functions/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nuglyan-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate JavaScript
        run: |
          node --check frontend/draft-queue.js
          node --check frontend/session-store.js
          node --check frontend/app.js
          node --check frontend/server.js
      - name: Run data-safety regression tests
        run: node --test tests/*.test.js
      - name: Validate static site
        run: |
          test -s frontend/index.html
          test -s frontend/style.css
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site
          cp frontend/index.html frontend/style.css frontend/draft-queue.js frontend/session-store.js frontend/app.js frontend/server.js frontend/favicon-nuglyan.png _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
